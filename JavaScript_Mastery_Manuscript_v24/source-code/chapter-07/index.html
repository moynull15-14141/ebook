<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Management Dashboard</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>Student Management Dashboard</h1><p>Chapter 7 • Objects and data modeling</p></header><section class="panel"><h2>Add / Edit Student</h2><form id="student-form"><label>Student ID<input id="id" required maxlength="20" placeholder="ST-101"></label><label>Full name<input id="name" required maxlength="80"></label><label>Age<input id="age" type="number" min="5" max="100" required></label><label>Marks<input id="marks" type="number" min="0" max="100" step="any" required></label><button id="save" type="submit">Save student</button><button type="button" id="cancel" hidden>Cancel edit</button></form><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><h2>Overview</h2><p id="summary"></p><label>Search students<input id="search" type="search" placeholder="Name or ID"></label><div class="scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Marks</th><th>Grade</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="students.js"></script><script src="app.js"></script></body></html>
