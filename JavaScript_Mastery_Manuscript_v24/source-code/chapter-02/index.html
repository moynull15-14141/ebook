<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Result Calculator</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card"><h1>Student Result Calculator</h1><p>প্রতিটি বিষয়ে ০–১০০ নম্বর দাও।</p><form id="result-form" novalidate><label>শিক্ষার্থীর নাম<input id="student-name" required maxlength="80" autocomplete="name"></label><label>বাংলা<input id="bangla" type="number" min="0" max="100" step="1" required></label><label>ইংরেজি<input id="english" type="number" min="0" max="100" step="1" required></label><label>গণিত<input id="math" type="number" min="0" max="100" step="1" required></label><button type="submit">ফলাফল দেখাও</button></form><section id="output" aria-live="polite"></section></main><script src="calculator.js"></script><script src="app.js"></script></body></html>
