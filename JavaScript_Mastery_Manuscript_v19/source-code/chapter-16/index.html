<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookingGuard — JavaScript Mastery</title><link rel="stylesheet" href="style.css"></head><body><main><header><p>Chapter 16 • Reliability Lab</p><h1>BookingGuard</h1><p>Validation • Error Handling • Automated Testing</p></header><section><h2>New Booking</h2><form id="bookingForm"><label>Customer Name<input name="customer" required minlength="2" maxlength="80"></label><label>Email<input name="email" type="email" required></label><label>Seats<input name="seats" type="number" min="1" max="9" value="1" required></label><label>Price per seat<input name="unitPrice" type="number" min="0.01" step="0.01" value="500" required></label><button type="submit">Confirm Booking</button></form><p id="message" role="status" aria-live="polite"></p></section><section><h2>Bookings</h2><p id="summary"></p><ul id="bookings"></ul></section></main><script type="module" src="app.mjs"></script></body></html>
