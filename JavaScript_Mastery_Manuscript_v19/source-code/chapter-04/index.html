<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cart Analyzer</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Cart Analyzer</h1><p>দামের একক: BDT (পূর্ণসংখ্যা)</p><form id="form"><label>Product name <input id="name" required maxlength="80" placeholder="Notebook"></label><label>Unit price <input id="price" type="number" min="0" step="1" required></label><label>Quantity <input id="qty" type="number" min="1" max="10000" step="1" required value="1"></label><button>Add item</button></form><button id="clear" type="button">Clear cart</button><p id="error" role="alert"></p><section aria-live="polite"><h2>Summary</h2><p id="summary"></p><ul id="items"></ul></section></main><script src="cart.js"></script><script src="app.js"></script></body></html>
