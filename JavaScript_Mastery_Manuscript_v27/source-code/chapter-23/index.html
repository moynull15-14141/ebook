<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelSearch Explorer</title><link rel="stylesheet" href="style.css"></head><body><main><h1>TravelSearch Explorer</h1><p>12,000 sample trips · virtual scrolling and measured filtering</p><section class="controls"><label>Search <input id="search" placeholder="Destination or trip"></label><label>Destination <select id="destination"><option value="all">All destinations</option></select></label><label>Sort <select id="sort"><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="rating-desc">Highest rated</option><option value="title">Title</option></select></label></section><p id="stats" role="status" aria-live="polite"></p><div id="viewport" role="region" aria-label="Trip results" tabindex="0"><div id="spacer"><div id="items"></div></div></div><p class="note">Educational dataset; prices are fictional. Performance depends on device and browser.</p></main><script type="module" src="app.mjs"></script></body></html>
