<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Dashboard — Chapter 6</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><header><p class="eyebrow">JAVASCRIPT MASTERY · CHAPTER 06</p><h1>Inventory Dashboard</h1><p>Manage products, monitor stock and analyze inventory value.</p></header>
<section class="metrics" aria-label="Inventory statistics"><article><span>Products</span><strong id="total-products">0</strong></article><article><span>Units</span><strong id="total-units">0</strong></article><article><span>Inventory value</span><strong id="inventory-value">৳0</strong></article><article><span>Low stock (≤5)</span><strong id="low-stock">0</strong></article></section>
<section class="panel"><h2>Add a product</h2><form id="product-form"><label>ID<input name="id" required maxlength="24" placeholder="P105"></label><label>Name<input name="name" required maxlength="80" placeholder="Keyboard"></label><label>Category<input name="category" required maxlength="40" placeholder="Accessories"></label><label>Price (BDT)<input name="price" required type="number" min="0" step="0.01"></label><label>Stock<input name="stock" required type="number" min="0" step="1"></label><button class="primary">Add product</button></form></section>
<section class="panel"><h2>Browse inventory</h2><div class="filters"><label>Search<input id="search" type="search" placeholder="Name or ID"></label><label>Category<select id="category"><option value="all">All categories</option></select></label><label>Sort by<select id="sort-by"><option value="name">Name</option><option value="price">Price</option><option value="stock">Stock</option><option value="category">Category</option></select></label><label>Direction<select id="direction"><option value="asc">Ascending</option><option value="desc">Descending</option></select></label><label class="check"><input type="checkbox" id="low-only"> Low stock only</label></div><p id="visible-count"></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Value</th><th>Actions</th></tr></thead><tbody id="inventory-rows"></tbody></table></div><button id="reset" class="secondary">Restore sample inventory</button><p id="status" role="status" aria-live="polite"></p></section>
</main><script src="inventory.js"></script><script src="app.js"></script></body></html>
