<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SalesFlow Analytics</title><link rel="stylesheet" href="style.css"></head><body><main><header><p>JavaScript Mastery · Chapter 18</p><h1>SalesFlow Analytics</h1><p>Pure functions · Immutability · Data Transformation</p></header><section class="controls"><label>Search<input id="query" placeholder="Product or order ID"></label><label>Category<select id="category"><option value="all">All categories</option></select></label><label>Status<select id="status"><option value="all">All statuses</option><option value="paid">Paid</option><option value="refunded">Refunded</option><option value="pending">Pending</option></select></label></section><section class="panel"><h2>Summary</h2><p id="summary" aria-live="polite"></p><h2>Orders</h2><div class="scroll"><table><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Status</th><th>Units</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table></div><h2>Category Ranking (paid orders)</h2><ol id="ranking"></ol></section><footer>Demo data only; totals exclude refunded and pending orders.</footer></main><script type="module" src="app.mjs"></script></body></html>
