<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Quality Lab</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Booking Quality Lab</h1><p>Educational demo: validate, place and confirm sample bookings.</p><form id="form"><label>Customer <input id="customer" required minlength="2" maxlength="60" value="Amina Rahman"></label><label>Package <select id="package"><option value="beach">Beach — BDT 4,500</option><option value="hills">Hills — BDT 7,200</option><option value="city">City — BDT 3,900</option></select></label><label>Guests <input id="guests" type="number" min="1" max="10" step="1" value="2"></label><button>Place demo booking</button></form><p id="message" role="status" aria-live="polite"></p><h2>Bookings</h2><ul id="bookings"></ul></main><script type="module" src="app.mjs"></script></body></html>
