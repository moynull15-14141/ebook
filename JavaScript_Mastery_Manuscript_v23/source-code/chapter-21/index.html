<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelFlow Booking Manager</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">CHAPTER 21 · DESIGN PATTERNS</p><h1>TravelFlow Booking Manager</h1><p>Educational browser demo — no real reservations or payments.</p></header><section class="panel"><h2>Create booking</h2><form id="form"><label>Customer name<input id="customer" required minlength="2" maxlength="80" placeholder="Customer name"></label><label>Package<select id="package" required></select></label><label>Travelers<input id="travelers" type="number" min="1" max="8" value="1" required></label><button type="submit">Create booking</button></form><p id="message" role="status" aria-live="polite"></p></section><section class="panel"><h2>Booking overview</h2><p id="summary"></p><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Package</th><th>Travelers</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module" src="app.mjs"></script></body></html>
