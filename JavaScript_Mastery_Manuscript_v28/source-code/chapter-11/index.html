<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrderGuard — Validation Lab</title><link rel="stylesheet" href="style.css"></head><body><main><h1>OrderGuard</h1><p>Defensive JavaScript: validate input, show actionable errors, recover safely.</p><form id="order-form" novalidate><label>Customer name<input name="customer" maxlength="80" required placeholder="e.g. Amina"></label><label>Email<input name="email" type="email" required placeholder="amina@example.com"></label><label>Product<select name="productId"><option value="notebook">Notebook — ৳180</option><option value="keyboard">Keyboard — ৳1,250</option><option value="mouse">Mouse — ৳650</option></select></label><label>Quantity<input name="quantity" type="number" min="1" max="100" step="1" value="1" required></label><button id="submit">Validate order</button></form><p id="feedback" role="status" aria-live="polite"></p><h2>Accepted orders (this page only)</h2><ol id="history"></ol><p class="note">Learning demo: no payment, database, or backend submission.</p></main><script type="module" src="app.mjs"></script></body></html>
