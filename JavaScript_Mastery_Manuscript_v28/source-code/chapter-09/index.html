<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager — Chapter 9</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><p class="eyebrow">JAVASCRIPT MASTERY • CHAPTER 09</p><h1>Task Manager</h1><p>DOM, Events, Filtering এবং localStorage দিয়ে তৈরি Interactive App</p></header><section class="panel"><form id="taskForm"><label for="taskTitle">নতুন কাজ</label><div class="entry"><input id="taskTitle" maxlength="120" required autocomplete="off" placeholder="যেমন: JavaScript DOM practice"><button type="submit">Add Task</button></div></form><p id="notice" role="status" aria-live="polite"></p></section><section class="panel"><div class="toolbar"><label for="search">Search<input id="search" type="search" placeholder="Search tasks"></label><label for="filter">Status<select id="filter"><option value="all">All</option><option value="active">Active</option><option value="completed">Completed</option></select></label></div><p id="summary" aria-live="polite"></p><ul id="taskList" aria-label="Tasks"></ul><p id="empty" hidden>No tasks match your filter.</p><button id="clearCompleted" class="secondary" type="button">Clear completed</button></section><footer>Saved locally in this browser. No server required.</footer></main><script src="task-core.js"></script><script src="app.js"></script></body></html>
