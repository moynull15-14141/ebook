<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookmark Vault</title><link rel="stylesheet" href="./style.css"></head>
<body><main><header><h1>🔖 Bookmark Vault</h1><p>Browser APIs ও Storage শেখার প্র্যাকটিক্যাল অ্যাপ</p></header>
<section><h2>নতুন Bookmark</h2><form id="form"><label>Title<input id="title" required minlength="2" maxlength="100" placeholder="MDN JavaScript"></label><label>URL<input id="url" type="url" required placeholder="https://developer.mozilla.org/"></label><label>Tags (comma separated)<input id="tags" placeholder="javascript, reference"></label><button>Add Bookmark</button></form><p id="status" role="status" aria-live="polite"></p></section>
<section><h2>Saved Links</h2><div class="toolbar"><input id="search" type="search" aria-label="Search bookmarks" placeholder="Search..."><input id="tagFilter" aria-label="Filter tag" placeholder="Filter by tag"><button id="export" type="button">Export JSON</button><label class="upload">Import JSON<input id="import" type="file" accept="application/json,.json"></label></div><p id="count"></p><ul id="list"></ul></section></main><script type="module" src="./app.mjs"></script></body></html>
